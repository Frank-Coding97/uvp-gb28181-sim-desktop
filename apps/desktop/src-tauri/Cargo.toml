[package]
name = "uvp-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UVP GB28181 桌面端(Tauri 后端)"

[lib]
# Tauri 2 推荐 lib + 薄 main 结构,便于移动端/测试复用。
name = "uvp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# 桌面端后端直接内嵌压测引擎(第一阶段同进程;后续可拆为独立 engine)。
stress-engine     = { path = "../../../crates/stress-engine" }
scenario          = { path = "../../../crates/scenario" }
gb28181-simulator = { path = "../../../crates/gb28181-simulator" }
sip-core          = { path = "../../../crates/sip-core" }
common            = { path = "../../../crates/common" }
tauri = { version = "2", features = [] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tauri-plugin-dialog = "2.0.0-rc.8"
