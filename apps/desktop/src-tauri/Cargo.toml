[package]
name = "uvp-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UVP GB28181 桌面端 v2(Tauri 后端)"

[lib]
name = "uvp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# v2 M2: 引入 tokio + serde + serde_json + tracing + tauri channel。
# daemon 子进程通信走 stdio (JSON-lines),tokio 异步 pipe + async command。
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2.0.0-rc.8"
tokio = { version = "1.40", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
