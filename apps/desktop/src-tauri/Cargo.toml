[package]
name = "uvp-desktop"
edition.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
description = "UVP GB28181 桌面端(Tauri 后端)"

[lib]
# Tauri 2 推荐 lib + 薄 main 结构,便于移动端/测试复用。
name = "uvp_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
# 桌面端后端直接内嵌压测引擎(第一阶段同进程;后续可拆为独立 engine)。
stress-engine     = { path = "../../../crates/stress-engine" }
scenario          = { path = "../../../crates/scenario" }
gb28181-simulator = { path = "../../../crates/gb28181-simulator" }
gb28181-protocol  = { path = "../../../crates/gb28181-protocol" }
media-rtp          = { path = "../../../crates/media-rtp" }
sip-core          = { path = "../../../crates/sip-core" }
encoding_rs       = { workspace = true }
base64            = "0.22"
if-addrs          = "0.15"
common            = { path = "../../../crates/common" }
tauri = { version = "=2.11.5", features = ["protocol-asset"] }
serde.workspace = true
serde_json.workspace = true
# 粘贴接入链接要直连平台兑换端点。走 Rust 侧而非 webview fetch:
# 桌面端页面跑在 tauri:// 自定义协议下,跨源请求会被 CORS 拦;
# 且自签证书需要显式决定信任策略,浏览器里没有这个操作空间。
# feature 与 gb28181-simulator 保持一致(默认 + json),共用同一份 TLS 构建产物。
reqwest = { version = "0.13.4", features = ["json"] }
toml = "=0.8.2"
tokio.workspace = true
tracing.workspace = true
tauri-plugin-dialog = "=2.7.1"

[features]
# 发布构建必须开启:tauri 用 `dev = !custom-protocol` 判定构建形态,
# 少了它 release 出来的二进制会内置 devUrl(去连 vite 开发服务器),
# 而不是把 ../dist 内嵌进去。`tauri build` 会自动带上这个 feature。
custom-protocol = ["tauri/custom-protocol"]
