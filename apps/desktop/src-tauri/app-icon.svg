<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="210" y1="60" x2="830" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4485FF"/>
      <stop offset="0.52" stop-color="#1E52E8"/>
      <stop offset="1" stop-color="#0C2578"/>
    </linearGradient>
    <radialGradient id="hl" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
      gradientTransform="translate(290 170) scale(650)">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="clip">
      <rect x="40" y="40" width="944" height="944" rx="216"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>
    <rect x="40" y="40" width="944" height="944" fill="url(#hl)"/>
  </g>

  <!-- 顶部标识：显示器剪影 + GB28181 -->
  <g fill="#FFFFFF">
    <rect x="243" y="250" width="132" height="92" rx="14"/>
    <rect x="303" y="342" width="12" height="18" rx="3"/>
    <rect x="276" y="356" width="66" height="13" rx="6.5"/>
  </g>
  <circle cx="309" cy="296" r="14" fill="#1B4CDC"/>

  <text x="413" y="343" fill="#FFFFFF" opacity="0.96"
    font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="92" letter-spacing="2" textLength="368" lengthAdjust="spacingAndGlyphs">GB28181</text>

  <!-- 主视觉：UVP -->
  <text x="509" y="770" fill="#FFFFFF" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="330" letter-spacing="8">UVP</text>
</svg>
