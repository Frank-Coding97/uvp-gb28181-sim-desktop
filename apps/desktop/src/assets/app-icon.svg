<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <!-- 与应用侧边栏左上角 .brand-logo 完全一致：linear-gradient(135deg, #3884ff, #1e63dc) -->
    <linearGradient id="bg" x1="40" y1="40" x2="984" y2="984" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3884FF"/>
      <stop offset="1" stop-color="#1E63DC"/>
    </linearGradient>
  </defs>

  <rect x="40" y="40" width="944" height="944" rx="216" fill="url(#bg)"/>

  <!-- 顶部标识：显示器剪影 + GB28181 -->
  <g fill="#FFFFFF">
    <rect x="243" y="250" width="132" height="92" rx="14"/>
    <rect x="303" y="342" width="12" height="18" rx="3"/>
    <rect x="276" y="356" width="66" height="13" rx="6.5"/>
  </g>
  <!-- 屏幕内镜头孔：取该处渐变本色，呈挖空效果 -->
  <circle cx="309" cy="296" r="14" fill="#317BF6"/>

  <text x="413" y="343" fill="#FFFFFF" opacity="0.96"
    font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="92" letter-spacing="2" textLength="368" lengthAdjust="spacingAndGlyphs">GB28181</text>

  <!-- 主视觉：UVP -->
  <text x="509" y="770" fill="#FFFFFF" text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif" font-weight="700"
    font-size="330" letter-spacing="8">UVP</text>
</svg>
