# CI:Rust 测试 + 三平台桌面安装包构建。
# 触发:push 到 main/develop、PR、以及打 tag(v*)时发布。
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── Rust 质量门:格式 / clippy / 测试 ──────────────────
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri 在 Linux 需要 WebKitGTK 等系统依赖。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 格式检查
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace -- -D warnings
      - name: 单元 + 集成测试
        run: cargo test --workspace

  # ── 三平台桌面安装包 ─────────────────────────────────
  build-desktop:
    needs: rust-check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci
      - name: 安装 macOS FFmpeg 运行时（含 OSD 烧录能力）
        if: matrix.os == 'macos-latest'
        run: |
          brew install ffmpeg
          # 官方 ffmpeg 编译时没有 libfreetype，只有 drawbox 没有 drawtext。
          # 内嵌它会导致发布包里 macOS 摄像头 OSD 静默降级成「画面无字」。
          # ffmpeg-full 来自 homebrew-core(预编译 bottle，keg-only)，带 freetype/fontconfig，
          # 不会覆盖 PATH 里的 ffmpeg；build-macos-dmg.sh 会优先挑它。
          brew install ffmpeg-full
      - name: 构建 macOS 完整 DMG（Swift runtime + FFmpeg）
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        env:
          BUNDLE_FFMPEG: "1"
          # 正式发布(tag)时缺 OSD 能力直接失败，避免静默产出不带水印的包。
          REQUIRE_OSD_FFMPEG: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          # 在线升级包只在发版时生成：PR / 分支构建拿不到签名私钥，也不需要 .sig。
          UVP_UPDATER: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./build-macos-dmg.sh
      - name: 构建 Linux 安装包
        if: matrix.os == 'ubuntu-latest'
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: 安装 Windows FFmpeg 运行时
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: choco install ffmpeg -y --no-progress
      - name: 构建 Windows 安装包（能力报告 + 内嵌 FFmpeg）
        if: matrix.os == 'windows-latest'
        working-directory: apps/desktop
        shell: pwsh
        env:
          # 只出 NSIS（-setup.exe）：updater 不支持 msi，双份包会装出两个应用。
          UVP_UPDATER: ${{ startsWith(github.ref, 'refs/tags/v') && '1' || '0' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/v') && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: ./build-windows.ps1
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app.tar.gz
            target/release/bundle/macos/*.sig
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.exe
            target/${{ matrix.target }}/release/bundle/**/*.sig
          if-no-files-found: ignore

  # ── 打 tag 时发布 GitHub Release ────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
