# CI:Rust 测试 + 三平台桌面安装包构建。
# 触发:push 到 main/develop、PR、以及打 tag(v*)时发布。
name: CI

on:
  push:
    branches: [main, develop]
    tags: ["v*"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  # ── Rust 质量门:格式 / clippy / 测试 ──────────────────
  rust-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Tauri 在 Linux 需要 WebKitGTK 等系统依赖。
      - name: 安装 Linux 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 格式检查
        run: cargo fmt --all -- --check
      # --all-targets 覆盖测试与 example,否则测试代码里的告警进不了质量门。
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: 单元 + 集成测试
        run: cargo test --workspace

  # ── 前端质量门:类型检查 / 单测 / 生产构建 ─────────────
  frontend-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci
      - name: 类型检查
        working-directory: apps/desktop
        run: npx vue-tsc --noEmit
      - name: 前端单测
        working-directory: apps/desktop
        run: npx vitest run
      - name: 生产构建
        working-directory: apps/desktop
        run: npx vite build

  # ── 凭据扫描:防止密码/密钥再次被提交 ──────────────────
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── 三平台桌面安装包 ─────────────────────────────────
  build-desktop:
    needs: [rust-check, frontend-check]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 安装 Linux 系统依赖
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - name: 安装前端依赖
        working-directory: apps/desktop
        run: npm ci
      - name: 安装 macOS FFmpeg 运行时
        if: matrix.os == 'macos-latest'
        run: brew install ffmpeg
      - name: 构建 macOS 完整 DMG（Swift runtime + FFmpeg）
        if: matrix.os == 'macos-latest'
        working-directory: apps/desktop
        env:
          BUNDLE_FFMPEG: "1"
        run: ./build-macos-dmg.sh
      - name: 构建 Linux / Windows 安装包
        if: matrix.os != 'macos-latest'
        working-directory: apps/desktop
        run: npm run tauri build -- --target ${{ matrix.target }}
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            target/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.dmg
            target/${{ matrix.target }}/release/bundle/**/*.deb
            target/${{ matrix.target }}/release/bundle/**/*.AppImage
            target/${{ matrix.target }}/release/bundle/**/*.msi
            target/${{ matrix.target }}/release/bundle/**/*.exe
          if-no-files-found: ignore

  # ── 打 tag 时发布 GitHub Release ────────────────────────
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 下载所有平台产物
        uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
