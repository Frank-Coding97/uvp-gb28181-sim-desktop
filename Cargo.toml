# UVP GB28181 Desktop —— Cargo workspace 根清单
#
# 分层依赖(自下而上,禁止环依赖):
#   common → sip-core / gb28181-protocol / media-rtp
#          → gb28181-simulator → scenario → stress-engine
# 详见 docs/architecture.md。

[workspace]
resolver = "2"
members = [
    "crates/common",
    "crates/sip-core",
    "crates/gb28181-protocol",
    "crates/media-rtp",
    "crates/gb28181-simulator",
    "crates/scenario",
    "crates/stress-engine",
    "apps/desktop/src-tauri",
]

# 各 crate 共享的依赖版本,子 crate 用 `xxx.workspace = true` 引用,统一管理。
[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
bytes = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
quick-xml = { version = "0.37", features = ["serialize"] }
encoding_rs = "0.8"
dashmap = "6"
parking_lot = "0.12"
md-5 = "0.10"
rand = "0.8"

[workspace.package]
edition = "2021"
version = "0.1.0"
license = "MIT"
rust-version = "1.75"

# 发布构建优化:压测引擎长时间高并发运行,开启 LTO 与单元优化。
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
