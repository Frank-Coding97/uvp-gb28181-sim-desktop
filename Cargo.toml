# UVP GB28181 Desktop v2 —— Cargo workspace 根清单
#
# v2 重构:后端 crates 全部删除,从零开始重写。

[workspace]
resolver = "2"
members = [
    "apps/desktop/src-tauri",
]

# workspace 依赖暂时清空,按需重建。

[workspace.package]
edition = "2021"
version = "0.2.0"
license = "MIT"
rust-version = "1.75"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
